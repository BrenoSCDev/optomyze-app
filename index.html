<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optomyze CRM</title>
    <link rel="icon" href="src/assets/opto-icon.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Prevent flash of wrong theme on load
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('crm_appearance') || '{}');
          if (stored.mode === 'dark') document.documentElement.classList.add('dark');
          if (stored.theme) document.documentElement.setAttribute('data-theme', stored.theme);
          else document.documentElement.setAttribute('data-theme', 'midnight_pulse');
          if (!stored.mode) document.documentElement.classList.add('dark');
        } catch(e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'midnight_pulse');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
